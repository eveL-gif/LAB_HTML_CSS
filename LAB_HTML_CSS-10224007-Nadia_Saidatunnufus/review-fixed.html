<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT Cipasung - Profil</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333333;
    }
    header {
      background-color: #003366;
      color: #ffffff;
      padding: 20px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
    }
    nav a {
      color: #ffffff;
      margin-right: 10px;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      padding: 20px;
      max-width: 800px;
    }
    h2 {
      font-size: 24px;
      margin-top: 20px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    img {
      max-width: 100%;
      height: auto;
      margin-top: 10px;
    }
    footer {
      background-color: #f1f1f1;
      padding: 10px 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>STT Cipasung</h1>
    <nav>
      <a href="#">Home</a> | 
      <a href="#">Programs</a> | 
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>About Us</h2>
      <p>STT Cipasung is a technology college in Tasikmalaya.</p>
      <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="Fasilitas Kampus STT Cipasung">
    </section>

    <section>
      <h2>Contact Us</h2>
      <form action="#" method="post">
        <div class="form-group">
          <label for="rev-name">Nama:</label>
          <input type="text" id="rev-name" name="name" placeholder="Name">
        </div>
        <div class="form-group">
          <label for="rev-email">Email:</label>
          <input type="email" id="rev-email" name="email" placeholder="Email">
        </div>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Copyright 2026 STT Cipasung</p>
  </footer>

</body>
</html>
